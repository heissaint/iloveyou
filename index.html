<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoYouLoveMe? ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card" id="card">

        <section id="question">
            <div class="cat">🐱💕</div>

            <h1>Do you love me? ❤️</h1>

            <div class="buttons">
                <button id="yes">Yes! 💖</button>
                <button id="no">No 😏</button>
            </div>

            <p id="hint">Be honest… are you sure? 🥺</p>
        </section>

        <section id="success" class="hidden">
            <div class="cat">🐱💕</div>

            <h1>YAY! I love you too! 🎉</h1>

            <div class="heart">❤️</div>

            <p>You made my heart skip a beat! 💗</p>

            <div class="love-art">
                <span>💗</span>
                LOVE<br>YOU!
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
